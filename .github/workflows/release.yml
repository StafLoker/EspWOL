name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  github-release:
    needs: ci
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Get version from tag
        id: version
        run: |
          echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Extract changelog for version
        id: changelog
        run: |
          VERSION=${{ steps.version.outputs.version }}
          NOTES=$(awk "/^## \\[$VERSION\\]/{found=1; next} found && /^## \\[/{exit} found{print}" CHANGELOG.md)
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Download firmware
        uses: actions/download-artifact@v8
        with:
          pattern: firmware-*
          path: artifacts/

      - name: Name each binary after its layout and the tag
        run: |
          mkdir -p bin
          for layout in 4M2M 1M64; do
            src="artifacts/firmware-$layout/EspWOL.ino.bin"
            if [ ! -f "$src" ]; then
              echo "::error::$src missing from the CI artifacts."
              exit 1
            fi
            cp "$src" "bin/EspWOL-$layout-${{ steps.version.outputs.tag }}.bin"
          done
          ls -l bin/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          body: |
            # EspWOL ${{ steps.version.outputs.tag }}

            ## Changelog

            ${{ steps.changelog.outputs.notes }}
          files: bin/*.bin
          fail_on_unmatched_files: true
