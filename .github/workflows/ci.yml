name: CI

on:
  pull_request:
    branches: ['main', 'develop']
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    name: Build web
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Format
        working-directory: web
        run: pnpm run format:check

      - name: Build (regenerates the PROGMEM page headers)
        working-directory: web
        run: pnpm run build

      - name: Upload generated headers
        uses: actions/upload-artifact@v7
        with:
          name: firmware-headers
          path: firmware/EspWOL/*.h
          if-no-files-found: error
          retention-days: 7

  build-firmware:
    name: Build firmware (${{ matrix.name }})
    needs: build-web
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 4MB boards (D1 mini, NodeMCU, ESP-12E/F): 2MB filesystem, ~1019KB OTA
          - name: 4M2M
            fqbn: esp8266:esp8266:d1_mini:eesz=4M2M
            ota_slot: 1044464
          # 1MB boards (ESP-01S, D1 mini Lite): 64KB filesystem, ~470KB OTA
          - name: 1M64
            fqbn: esp8266:esp8266:generic:eesz=1M64
            ota_slot: 481280
    steps:
      - uses: actions/checkout@v7

      - name: Take the headers built by build-web
        uses: actions/download-artifact@v8
        with:
          name: firmware-headers
          path: firmware/EspWOL/

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2.0.0
        with:
          version: 1.5.1

      - name: Cache Arduino data
        uses: actions/cache@v6
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-esp8266-3.1.2-wm2.0.17-aj7.4.3-wol1.1.7-gt1.1.3-ping4c1a064

      - name: Install platform and libraries
        env:
          ESP8266_INDEX: https://arduino.esp8266.com/stable/package_esp8266com_index.json
        run: |
          arduino-cli core update-index --additional-urls "$ESP8266_INDEX"
          arduino-cli core install esp8266:esp8266@3.1.2 --additional-urls "$ESP8266_INDEX"

          arduino-cli lib install \
            WiFiManager@2.0.17 \
            ArduinoJson@7.4.3 \
            WakeOnLan@1.1.7 \
            GTimer@1.1.3

          # ESP8266Ping is the one dependency missing from the Library Manager
          # index. It publishes no tags either, so it is pinned by commit.
          if [ ! -d ~/Arduino/libraries/ESP8266Ping ]; then
            mkdir -p ~/Arduino/libraries
            git clone https://github.com/dancol90/ESP8266Ping ~/Arduino/libraries/ESP8266Ping
            git -C ~/Arduino/libraries/ESP8266Ping checkout 4c1a064a8a64dd376d4822f9fa7889baa0484a2d
          fi

      - name: Compile ESP8266 firmware
        run: |
          arduino-cli compile \
            --fqbn ${{ matrix.fqbn }} \
            --warnings more \
            --clean \
            --output-dir bin \
            firmware/EspWOL/EspWOL.ino

      # arduino-cli reports the same 1MB ceiling whatever the layout, so it never
      # fails a build that cannot be flashed over the air. An OTA needs the new
      # image to fit the spare sketch slot; check that here instead.
      - name: Check the image fits its OTA slot
        env:
          OTA_SLOT: ${{ matrix.ota_slot }}
        run: |
          SIZE=$(stat -c%s bin/EspWOL.ino.bin)
          echo "image: $SIZE bytes, OTA slot: $OTA_SLOT bytes"
          if [ "$SIZE" -gt "$OTA_SLOT" ]; then
            echo "::error::Image is $SIZE bytes and does not fit the ${{ matrix.name }} OTA slot of $OTA_SLOT bytes."
            exit 1
          fi
          HEADROOM=$(( OTA_SLOT - SIZE ))
          if [ "$HEADROOM" -lt 20480 ]; then
            echo "::warning::Only $HEADROOM bytes spare in the ${{ matrix.name }} OTA slot."
          fi

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.name }}
          path: bin/EspWOL.ino.bin
          if-no-files-found: error
          retention-days: 7
