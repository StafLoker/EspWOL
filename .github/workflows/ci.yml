name: CI

on:
  pull_request:
    branches: ['main', 'develop']
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Format
        working-directory: web
        run: pnpm run format:check

      - name: Build (regenerates the PROGMEM page headers)
        working-directory: web
        run: pnpm run build

      # The generated headers are committed, so the firmware compiles from what
      # the tag contains. A diff here means someone edited web/ without running
      # `pnpm run build`.
      - name: Generated headers are up to date
        run: |
          if ! git diff --exit-code --stat -- firmware/EspWOL; then
            echo "::error::Generated headers are stale. Run 'pnpm run build' in web/ and commit the result."
            exit 1
          fi

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2.0.0
        with:
          version: 1.5.1

      - name: Cache Arduino data
        uses: actions/cache@v6
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-esp8266-3.1.2-wm2.0.17-aj7.4.3-wol1.1.7-gt1.1.3-ping4c1a064

      - name: Install platform and libraries
        env:
          ESP8266_INDEX: https://arduino.esp8266.com/stable/package_esp8266com_index.json
        run: |
          arduino-cli core update-index --additional-urls "$ESP8266_INDEX"
          arduino-cli core install esp8266:esp8266@3.1.2 --additional-urls "$ESP8266_INDEX"

          arduino-cli lib install \
            WiFiManager@2.0.17 \
            ArduinoJson@7.4.3 \
            WakeOnLan@1.1.7 \
            GTimer@1.1.3

          # ESP8266Ping is the one dependency missing from the Library Manager
          # index. It publishes no tags either, so it is pinned by commit.
          if [ ! -d ~/Arduino/libraries/ESP8266Ping ]; then
            mkdir -p ~/Arduino/libraries
            git clone https://github.com/dancol90/ESP8266Ping ~/Arduino/libraries/ESP8266Ping
            git -C ~/Arduino/libraries/ESP8266Ping checkout 4c1a064a8a64dd376d4822f9fa7889baa0484a2d
          fi

      - name: Compile ESP8266 firmware
        run: |
          arduino-cli compile \
            --fqbn esp8266:esp8266:generic \
            --warnings more \
            --clean \
            --output-dir bin \
            firmware/EspWOL/EspWOL.ino

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: bin/EspWOL.ino.bin
          if-no-files-found: error
          retention-days: 7
