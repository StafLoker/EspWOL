<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#18181b" />
    <title>Firmware update — EspWOL</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #18181b;
        --surface: #212124;
        --surface-hover: #26262a;
        --border: #2e2e32;
        --border-strong: #3f3f46;
        --fg: #e4e4e7;
        --fg-muted: #a1a1aa;
        --fg-subtle: #8b8b93;
        --online: #4ade80;
        --danger: #f87171;
        --radius: 0.5rem;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: var(--bg);
        color: var(--fg);
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 24rem;
        padding: 1.25rem;
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        background: var(--surface);
      }
      h1 {
        margin: 0 0 0.375rem;
        font-size: 1rem;
        font-weight: 500;
      }
      p.hint {
        margin: 0 0 1.25rem;
        font-size: 0.8125rem;
        color: var(--fg-subtle);
        line-height: 1.6;
      }
      input[type='file'] {
        width: 100%;
        margin-bottom: 1rem;
        font-size: 0.875rem;
        color: var(--fg-muted);
      }
      input[type='file']::file-selector-button {
        margin-right: 0.75rem;
        padding: 0.4rem 0.875rem;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius);
        background: none;
        color: var(--fg-muted);
        font: inherit;
        font-size: 0.875rem;
        cursor: pointer;
      }
      input[type='file']::file-selector-button:hover {
        background: var(--surface-hover);
        border-color: #52525b;
      }
      .btn-primary {
        width: 100%;
        padding: 0.5rem 1rem;
        border: 0;
        border-radius: var(--radius);
        background: var(--fg);
        color: var(--bg);
        font: inherit;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
        transition: background-color 0.15s;
      }
      .btn-primary:hover:not(:disabled) {
        background: #fff;
      }
      .btn-primary:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      :focus-visible {
        outline: 2px solid var(--fg);
        outline-offset: 2px;
        border-radius: var(--radius);
      }
      progress {
        display: none;
        width: 100%;
        height: 0.25rem;
        margin-top: 1rem;
        border: 0;
        accent-color: var(--fg);
      }
      .msg {
        margin-top: 1rem;
        font-size: 0.8125rem;
        color: var(--fg-muted);
        line-height: 1.6;
      }
      .msg.err {
        color: var(--danger);
      }
      .msg.ok {
        color: var(--online);
      }
      .back {
        display: block;
        margin-top: 1rem;
        font-size: 0.8125rem;
        color: var(--fg-muted);
        text-align: center;
        text-decoration: none;
      }
      .back:hover {
        color: var(--fg);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Firmware update</h1>
      <p class="hint">Upload a .bin built for this device. It reboots when done.</p>
      <form id="form">
        <input
          type="file"
          name="firmware"
          accept=".bin"
          required
          aria-label="Firmware file"
        />
        <button type="submit" id="submit" class="btn-primary">Upload and flash</button>
        <progress
          id="progress"
          max="100"
          value="0"
          aria-label="Upload progress"
        ></progress>
        <p class="msg" id="status" role="status" aria-live="polite"></p>
      </form>
      <a class="back" href="/">Go to home</a>
    </main>
    <script>
      const form = document.getElementById('form')
      const submitButton = document.getElementById('submit')
      const progressBar = document.getElementById('progress')
      const statusText = document.getElementById('status')

      form.addEventListener('submit', (event) => {
        event.preventDefault()

        const request = new XMLHttpRequest()
        request.open('POST', '/update')
        progressBar.style.display = 'block'
        submitButton.disabled = true
        statusText.className = 'msg'
        statusText.textContent = 'Uploading…'

        request.upload.onprogress = (event) => {
          if (event.lengthComputable) {
            progressBar.value = (event.loaded / event.total) * 100
          }
        }
        request.onload = () => {
          if (request.status === 200) {
            statusText.className = 'msg ok'
            statusText.textContent =
              'Done. Rebooting — this page stops responding for about 15s.'
          } else {
            statusText.className = 'msg err'
            statusText.textContent = 'Failed: ' + request.responseText
            submitButton.disabled = false
          }
        }
        request.onerror = () => {
          statusText.className = 'msg err'
          statusText.textContent = 'Upload error.'
          submitButton.disabled = false
        }
        request.send(new FormData(form))
      })
    </script>
  </body>
</html>
