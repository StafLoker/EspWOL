<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#18181b" />
    <title>Not found — EspWOL</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #18181b;
        --surface: #212124;
        --border: #2e2e32;
        --fg: #e4e4e7;
        --fg-subtle: #8b8b93;
        --radius: 0.5rem;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: var(--bg);
        color: var(--fg);
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 22rem;
        padding: 2rem 1.5rem;
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        background: var(--surface);
        text-align: center;
      }
      .code {
        margin: 0;
        font-size: 2.5rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      h1 {
        margin: 0.75rem 0 0.375rem;
        font-size: 1rem;
        font-weight: 500;
      }
      p.hint {
        margin: 0 0 1.5rem;
        font-size: 0.875rem;
        color: var(--fg-subtle);
      }
      .btn-primary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.5rem 0.875rem;
        border-radius: var(--radius);
        background: var(--fg);
        color: var(--bg);
        font-size: 0.875rem;
        font-weight: 500;
        text-decoration: none;
        transition: background-color 0.15s;
      }
      .btn-primary:hover {
        background: #fff;
      }
      :focus-visible {
        outline: 2px solid var(--fg);
        outline-offset: 2px;
        border-radius: var(--radius);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>Page not found</h1>
      <p class="hint">That route does not exist on this device.</p>
      <a class="btn-primary" href="/">Go to home</a>
    </main>
  </body>
</html>
