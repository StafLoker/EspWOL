<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#18181b" />
    <title>Not found — EspWOL</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: #18181b;
        color: #e4e4e7;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        text-align: center;
        max-width: 22rem;
      }
      .code {
        font-size: 2.5rem;
        font-weight: 600;
        letter-spacing: -0.02em;
        margin: 0;
      }
      h1 {
        font-size: 1rem;
        font-weight: 500;
        margin: 0.75rem 0 0.375rem;
      }
      .hint {
        font-size: 0.875rem;
        color: #8b8b93;
        margin: 0 0 1.5rem;
        line-height: 1.6;
      }
      a {
        display: inline-block;
        background: #e4e4e7;
        color: #18181b;
        text-decoration: none;
        border-radius: 0.5rem;
        padding: 0.5rem 1rem;
        font-size: 0.875rem;
        font-weight: 500;
      }
      a:hover {
        background: #fff;
      }
      a:focus-visible {
        outline: 2px solid #e4e4e7;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>Page not found</h1>
      <p class="hint">That route does not exist on this device.</p>
      <a href="/">Back to hosts</a>
    </main>
  </body>
</html>
